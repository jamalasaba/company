<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ken's Entreprise | Admin Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0b0b0b;color:#f5f5f5}button,select{font:inherit}.dash{max-width:1400px;margin:auto;padding:28px 5% 50px}.dashhead{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:14px;background:#fff;color:#111;display:grid;place-items:center;font-weight:900;font-size:19px}.tag{display:inline-block;color:#aaa;font-size:12px;letter-spacing:2px;font-weight:700;margin-bottom:5px}h1{margin:0;font-size:30px}#welcome{color:#aaa;margin:6px 0 0}.actions{display:flex;gap:10px}.btn{border:0;border-radius:10px;padding:11px 17px;cursor:pointer;font-weight:700}.primary{background:#fff;color:#111}.secondary{background:#222;color:#fff;border:1px solid #444}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{padding:22px;background:linear-gradient(145deg,#1b1b1b,#121212);border:1px solid #303030;border-radius:16px}.stat small{color:#999;text-transform:uppercase;letter-spacing:1px}.stat b{display:block;font-size:38px;margin-top:8px}.panel{margin-top:22px;padding:22px;background:#151515;border:1px solid #303030;border-radius:16px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.panel h2{margin:0;font-size:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{padding:10px 15px;background:#252525;color:#ddd;border:1px solid #444;border-radius:9px;cursor:pointer}.tab.active{background:#fff;color:#111}.notice{padding:12px 14px;border-radius:9px;background:#202020;color:#bbb;margin:15px 0}.tablewrap{overflow:auto;border:1px solid #2c2c2c;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px 12px;border-bottom:1px solid #292929;text-align:left;vertical-align:top}th{color:#999;font-size:12px;text-transform:uppercase;letter-spacing:.7px;background:#191919}tr:last-child td{border-bottom:0}select{background:#222;color:#fff;border:1px solid #555;padding:8px 10px;border-radius:7px}.status{font-size:12px;color:#aaa}.empty,.loading{text-align:center;padding:35px;color:#888}.error{padding:15px;background:#2a1515;border:1px solid #603030;color:#ffb4b4;border-radius:10px}footer{text-align:center;color:#666;font-size:12px;margin-top:25px}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.dashhead{flex-direction:column;align-items:flex-start}}@media(max-width:520px){.stats{grid-template-columns:1fr}.actions{width:100%}.actions .btn{flex:1}h1{font-size:25px}}
</style></head>
<body><div class="dash">
<div class="dashhead"><div class="brand"><div class="logo">KE</div><div><div class="tag">ADMIN PORTAL</div><h1>Ken's Entreprise</h1><p id="welcome">Loading administrator...</p></div></div><div class="actions"><button class="btn primary" onclick="refreshAll()">↻ Refresh</button><button class="btn secondary" onclick="logout()">Logout</button></div></div>
<div class="stats"><div class="stat"><small>Customers</small><b id="customers">0</b></div><div class="stat"><small>Services</small><b id="services">0</b></div><div class="stat"><small>Requests</small><b id="requests">0</b></div><div class="stat"><small>Messages</small><b id="messages">0</b></div></div>
<div class="panel"><div class="panelhead"><h2>Business Management</h2><div id="lastUpdated" class="status">Not refreshed yet</div></div><div class="tabs"><button class="tab active" onclick="tab('requests',this)">Service Requests</button><button class="tab" onclick="tab('messages',this)">Messages</button><button class="tab" onclick="tab('customers',this)">Customers</button></div><div id="notice" class="notice">Loading business data...</div><div id="content"><div class="loading">Loading...</div></div></div>
<footer>Ken's Entreprise • Your Convenience, Our Priority</footer></div>
<script>
const admin=JSON.parse(localStorage.getItem('admin')||'null');if(!admin)location.href='/login.html';document.getElementById('welcome').textContent='Welcome, '+(admin?.full_name||'Administrator');
const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function setNotice(message,type='normal'){const n=document.getElementById('notice');n.textContent=message;n.className=type==='error'?'error':'notice'}
async function getJSON(url,options={}){const response=await fetch(url,options);const data=await response.json().catch(()=>({success:false,message:'Invalid server response'}));if(!response.ok||data.success===false)throw new Error(data.message||'Server request failed');return data}
async function summary(){const d=await getJSON('/api/admin/summary');document.getElementById('customers').textContent=d.summary.customers;document.getElementById('services').textContent=d.summary.services;document.getElementById('requests').textContent=d.summary.service_requests;document.getElementById('messages').textContent=d.summary.messages}
async function tab(type,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');const c=document.getElementById('content');c.innerHTML='<div class="loading">Loading...</div>';try{
if(type==='requests'){const d=await getJSON('/api/admin/requests');const rows=d.requests||[];if(!rows.length){c.innerHTML='<div class="empty">No service requests yet.</div>';return}c.innerHTML='<div class="tablewrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Service</th><th>Details</th><th>Status</th><th>Date</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>#${x.request_id}</td><td><strong>${esc(x.full_name)}</strong></td><td>${esc(x.phone)}</td><td>${esc(x.service_name)}</td><td>${esc(x.request_details)}</td><td><select onchange="status(${x.request_id},this.value)">${['Pending','Approved','Completed','Cancelled'].map(s=>`<option value="${s}" ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td>${x.created_at?new Date(x.created_at).toLocaleString():''}</td></tr>`).join('')+'</tbody></table></div>'}
if(type==='messages'){const d=await getJSON('/api/admin/messages');const rows=d.messages||[];if(!rows.length){c.innerHTML='<div class="empty">No messages received yet.</div>';return}c.innerHTML='<div class="tablewrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Subject</th><th>Message</th><th>Status</th><th>Date</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>#${x.message_id}</td><td><strong>${esc(x.full_name||'Website Visitor')}</strong><br><span class="status">${esc(x.phone||'')}</span></td><td>${esc(x.subject||'Website Message')}</td><td>${esc(x.message)}</td><td>${esc(x.status)}</td><td>${x.created_at?new Date(x.created_at).toLocaleString():''}</td></tr>`).join('')+'</tbody></table></div>'}
if(type==='customers'){const d=await getJSON('/api/admin/customers');const rows=d.customers||[];if(!rows.length){c.innerHTML='<div class="empty">No customers registered yet.</div>';return}c.innerHTML='<div class="tablewrap"><table><thead><tr><th>ID</th><th>Full Name</th><th>Phone</th><th>Email</th><th>Registered</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>#${x.customer_id}</td><td><strong>${esc(x.full_name)}</strong></td><td>${esc(x.phone)}</td><td>${esc(x.email||'Not provided')}</td><td>${x.created_at?new Date(x.created_at).toLocaleString():''}</td></tr>`).join('')+'</tbody></table></div>'}
}catch(err){c.innerHTML='<div class="error">Could not load this section: '+esc(err.message)+'</div>'}}
async function status(id,s){try{await getJSON('/api/admin/requests/'+id+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});setNotice('Request #'+id+' updated to '+s+'.');await summary()}catch(err){setNotice('Could not update request: '+err.message,'error')}}
async function refreshAll(){setNotice('Refreshing dashboard...');try{await summary();const active=document.querySelector('.tab.active');const type=active&&active.textContent.includes('Customer')?'customers':active&&active.textContent.includes('Message')?'messages':'requests';await tab(type,active);document.getElementById('lastUpdated').textContent='Updated '+new Date().toLocaleTimeString();setNotice('Dashboard data is up to date.')}catch(err){setNotice('Could not refresh dashboard: '+err.message,'error')}}
function logout(){localStorage.removeItem('admin');location.href='/login.html'}
refreshAll();
</script></body></html>
